<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOS Explorer - Interface de Consultation Interactive</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🏥</span>
                    <h1>ECOS Explorer</h1>
                    <span class="version">v3.0</span>
                </div>
                <div class="header-stats">
                    <div class="stat">
                        <span class="stat-value" id="total-cases">374</span>
                        <span class="stat-label">Cas cliniques</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="total-categories">17</span>
                        <span class="stat-label">Catégories</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="years-range">2011-2025</span>
                        <span class="stat-label">Période</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Search and Filters -->
        <div class="search-section">
            <div class="search-container">
                <input type="text" id="search-input" class="search-input"
                       placeholder="🔍 Rechercher par diagnostic, SSP, symptôme...">
                <button id="search-btn" class="search-btn">Rechercher</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>Année</label>
                    <select id="filter-year" class="filter-select">
                        <option value="">Toutes</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Catégorie</label>
                    <select id="filter-category" class="filter-select">
                        <option value="">Toutes</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Code SSP</label>
                    <select id="filter-ssp" class="filter-select">
                        <option value="">Tous</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Complétude</label>
                    <select id="filter-completeness" class="filter-select">
                        <option value="">Tous</option>
                        <option value="high">≥ 75%</option>
                        <option value="medium">50-75%</option>
                        <option value="low">< 50%</option>
                    </select>
                </div>

                <button id="reset-filters" class="reset-btn">↻ Réinitialiser</button>
            </div>
        </div>

        <!-- Quick Stats Dashboard -->
        <div class="dashboard">
            <div class="dashboard-card">
                <h3>Répartition par Catégorie</h3>
                <canvas id="category-chart"></canvas>
            </div>
            <div class="dashboard-card">
                <h3>Évolution Temporelle</h3>
                <canvas id="timeline-chart"></canvas>
            </div>
            <div class="dashboard-card">
                <h3>Top 10 Diagnostics</h3>
                <div id="top-diagnostics"></div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header">
                <h2>Cas Cliniques <span id="results-count">(374)</span></h2>
                <div class="view-options">
                    <button class="view-btn active" data-view="cards">📇 Cartes</button>
                    <button class="view-btn" data-view="table">📊 Tableau</button>
                    <button class="view-btn" data-view="detail">📋 Détaillé</button>
                </div>
            </div>

            <div id="results-container" class="results-container cards-view">
                <!-- Results will be populated here -->
            </div>

            <div class="pagination">
                <button id="prev-page" class="page-btn">← Précédent</button>
                <span id="page-info">Page 1 / 10</span>
                <button id="next-page" class="page-btn">Suivant →</button>
            </div>
        </div>

        <!-- Case Detail Modal -->
        <div id="case-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="modal-body">
                    <!-- Case details will be populated here -->
                </div>
            </div>
        </div>

        <!-- Export Options -->
        <div class="export-section">
            <h3>Options d'Export</h3>
            <div class="export-buttons">
                <button id="export-csv" class="export-btn">📄 CSV</button>
                <button id="export-json" class="export-btn">📊 JSON</button>
                <button id="export-pdf" class="export-btn">📑 PDF</button>
                <button id="export-ecos" class="export-btn primary">🎓 Export ECOS Formation</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

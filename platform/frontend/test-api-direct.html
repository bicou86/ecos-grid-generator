<!DOCTYPE html>
<html>
<head>
    <title>Direct API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Direct API Connection Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        async function testCasesAPI() {
            results.innerHTML += '<h2>Testing Cases API...</h2>';
            try {
                const response = await fetch('http://localhost:3000/api/v1/cases?limit=5');
                const data = await response.json();

                results.innerHTML += `
                    <h3 class="success">✅ Cases API Working!</h3>
                    <p>Success: ${data.success}</p>
                    <p>Total cases in response: ${data.data ? data.data.length : 0}</p>
                    <p>Pagination total: ${data.pagination ? data.pagination.total : 'N/A'}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                results.innerHTML += `<h3 class="error">❌ Cases API Failed</h3><pre>${error.message}</pre>`;
            }
        }

        async function testFichesAPI() {
            results.innerHTML += '<h2>Testing Fiches API...</h2>';
            try {
                const response = await fetch('http://localhost:3000/api/v1/fiches?limit=5');
                const data = await response.json();

                results.innerHTML += `
                    <h3 class="success">✅ Fiches API Working!</h3>
                    <p>Success: ${data.success}</p>
                    <p>Total fiches in response: ${data.data ? data.data.length : 0}</p>
                    <p>Pagination total: ${data.pagination ? data.pagination.total : 'N/A'}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                results.innerHTML += `<h3 class="error">❌ Fiches API Failed</h3><pre>${error.message}</pre>`;
            }
        }

        async function testStatsAPI() {
            results.innerHTML += '<h2>Testing Stats API...</h2>';
            try {
                const response = await fetch('http://localhost:3000/api/v1/stats');
                const data = await response.json();

                results.innerHTML += `
                    <h3 class="success">✅ Stats API Working!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                results.innerHTML += `<h3 class="error">❌ Stats API Failed</h3><pre>${error.message}</pre>`;
            }
        }

        async function runAllTests() {
            await testStatsAPI();
            await testCasesAPI();
            await testFichesAPI();
        }

        runAllTests();
    </script>
</body>
</html>

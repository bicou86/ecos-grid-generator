<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 Guide Chirurgie ECOS - Révisions Interactives</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4a90e2, #7b68ee);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            bottom: -50%;
            left: -50%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        .controls {
            background: #f8f9fa;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            border-bottom: 3px solid #e9ecef;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #7b68ee;
            box-shadow: 0 0 0 3px rgba(123, 104, 238, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #7b68ee, #9b59b6);
            color: white;
            border-color: transparent;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .mode-btn {
            padding: 10px 20px;
            border: none;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .mode-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(58, 123, 213, 0.4);
        }

        .mode-btn.quiz-mode {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .stats {
            background: #fff3cd;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-icon {
            font-size: 24px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #6c5ce7;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .section:hover {
            border-color: #7b68ee;
            box-shadow: 0 10px 30px rgba(123, 104, 238, 0.1);
        }

        .section-header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .section-header:hover {
            background: linear-gradient(135deg, #5f3dc4, #9775fa);
        }

        .section-title {
            font-size: 1.4em;
            font-weight: 600;
        }

        .section-count {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 500;
        }

        .section-content {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .section.active .section-content {
            max-height: 5000px;
            padding: 20px;
        }

        .pathology-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }

        .pathology-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .pathology-header {
            background: linear-gradient(135deg, #48c9b0, #45b7aa);
            color: white;
            padding: 15px 20px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pathology-content {
            padding: 20px;
            display: none;
        }

        .pathology-card.expanded .pathology-content {
            display: block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .info-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #7b68ee;
        }

        .info-label {
            font-weight: 600;
            color: #6c5ce7;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-text {
            color: #495057;
            line-height: 1.6;
        }

        .quiz-mode-content {
            display: none;
            padding: 30px;
        }

        .quiz-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .quiz-question {
            font-size: 1.3em;
            color: #2c3e50;
            margin-bottom: 20px;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            border-left: 5px solid #3498db;
        }

        .quiz-options {
            display: grid;
            gap: 15px;
        }

        .quiz-option {
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quiz-option:hover {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
            animation: correctPulse 0.5s;
        }

        .quiz-option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            animation: shake 0.5s;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .expand-icon {
            transition: transform 0.3s;
        }

        .pathology-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .highlight {
            background-color: #fff3cd;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 1000;
        }

        .floating-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .progress-bar {
            height: 5px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.5s ease;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .search-box {
                width: 100%;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            body {
                background: white;
            }
            
            .controls, .floating-btn, .mode-toggle {
                display: none;
            }
            
            .section-content {
                max-height: none !important;
                padding: 20px !important;
            }
            
            .pathology-content {
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">

            <p class="subtitle">Révisions Interactives - Terminologie Française</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Rechercher une pathologie, un symptôme, un traitement...">
                <span class="search-icon">🔎</span>
            </div>

                <button class="filter-btn active" data-filter="all">Tout</button>

                <button class="filter-btn" data-filter="vasculaire">Vasculaire</button>
                <button class="filter-btn" data-filter="trauma">Trauma</button>

                <button class="mode-btn" id="studyBtn">📚 Mode Étude</button>
                <button class="mode-btn quiz-mode" id="quizBtn">🎯 Mode Quiz</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-icon">📋</span>
                <div>
                    <div class="stat-value" id="totalPathologies">0</div>
                    <div>Pathologies</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">✅</span>
                <div>
                    <div class="stat-value" id="studiedCount">0</div>
                    <div>Étudiées</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">📊</span>
                <div>
                    <div class="stat-value" id="progressPercent">0%</div>
                    <div>Progression</div>
                </div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="studyContent">
            <!-- Les sections seront générées par JavaScript -->
        </div>

        <div class="quiz-mode-content" id="quizContent">
            <div class="quiz-card">
                <h2>🎯 Mode Quiz - Test tes connaissances!</h2>

                <button class="mode-btn" onclick="startQuiz()">Commencer le Quiz</button>
            </div>
        </div>
    </div>

    <button class="floating-btn" onclick="scrollToTop()">⬆️</button>

                <div class="info-grid">
                    ${pathology.Anamnèse ? `
                        <div class="info-item">
                            <div class="info-label">📋 Anamnèse</div>
                            <div class="info-text">${formatText(pathology.Anamnèse)}</div>
                        </div>
                    ` : ''}
                    ${pathology['Examen Physique'] ? `
                        <div class="info-item">
                            <div class="info-label">🩺 Examen Physique</div>
                            <div class="info-text">${formatText(pathology['Examen Physique'])}</div>
                        </div>
                    ` : ''}
                    ${pathology['Procédures/Examens'] ? `
                        <div class="info-item">
                            <div class="info-label">🔬 Procédures/Examens</div>
                            <div class="info-text">${formatText(pathology['Procédures/Examens'])}</div>
                        </div>
                    ` : ''}
                    ${pathology.Thérapie ? `
                        <div class="info-item">
                            <div class="info-label">💊 Thérapie</div>
                            <div class="info-text">${formatText(pathology.Thérapie)}</div>
                        </div>
                    ` : ''}
                    ${pathology.Commentaires ? `
                        <div class="info-item">
                            <div class="info-label">💡 Commentaires</div>
                            <div class="info-text">${formatText(pathology.Commentaires)}</div>
                        </div>
                    ` : ''}
                </div>
            `;
            
            card.appendChild(header);
            card.appendChild(content);
            return card;
        }

        // Formatage du texte avec mise en évidence
        function formatText(text) {
            if (!text) return '';
            return text
                .replace(/>/g, '→')
                .replace(/</g, '&lt;')
                .replace(/(\d+[°℃]C?)/g, '<span class="highlight">$1</span>')
                .replace(/(\d+\s?mg)/g, '<span class="highlight">$1</span>')
                .replace(/(\d+\s?mm)/g, '<span class="highlight">$1</span>');
        }

        // Toggle section
        function toggleSection(section) {
            section.classList.toggle('active');
        }

        // Toggle carte
        function toggleCard(card, id) {
            card.classList.toggle('expanded');
            if (card.classList.contains('expanded')) {
                studiedCards.add(id);
                updateStats();
            }
        }

        // Configuration des event listeners
        function setupEventListeners() {
            // Recherche
            document.getElementById('searchInput').addEventListener('input', function(e) {
                filterContent(e.target.value.toLowerCase());
            });

            // Filtres
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    applyFilter();
                });
            });

            // Mode boutons
            document.getElementById('studyBtn').addEventListener('click', showStudyMode);
            document.getElementById('quizBtn').addEventListener('click', showQuizMode);
        }

        // Filtrage du contenu
        function filterContent(searchTerm) {
            const cards = document.querySelectorAll('.pathology-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Appliquer le filtre de catégorie
        function applyFilter() {
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => {
                if (currentFilter === 'all' || section.dataset.category === currentFilter) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        }

        // Mode étude
        function showStudyMode() {
            document.getElementById('studyContent').style.display = 'block';
            document.getElementById('quizContent').style.display = 'none';
        }

        // Mode quiz
        function showQuizMode() {
            document.getElementById('studyContent').style.display = 'none';
            document.getElementById('quizContent').style.display = 'block';
        }

        // Démarrer le quiz
        function startQuiz() {
            generateQuizQuestions();
            currentQuestionIndex = 0;
            showQuestion();
        }

        // Générer les questions du quiz
        function generateQuizQuestions() {
            quizQuestions = [];
            chirurgieData.sections.forEach(section => {
                section.data.forEach(pathology => {
                    // Question sur l'anamnèse
                    if (pathology.Anamnèse) {
                        quizQuestions.push({
                            question: `Quelle est l'anamnèse typique pour ${pathology.Pathologie} ?`,
                            correct: pathology.Anamnèse,
                            options: generateOptions(pathology.Anamnèse, 'anamnese')
                        });
                    }
                    // Question sur la thérapie
                    if (pathology.Thérapie) {
                        quizQuestions.push({
                            question: `Quel est le traitement pour ${pathology.Pathologie} ?`,
                            correct: pathology.Thérapie,
                            options: generateOptions(pathology.Thérapie, 'therapie')
                        });
                    }
                });
            });
            // Mélanger les questions
            quizQuestions.sort(() => Math.random() - 0.5);
        }

        // Générer des options pour le quiz
        function generateOptions(correct, type) {
            const options = [correct];
            // Ajouter 3 options incorrectes (simplifiées pour cet exemple)
            const fakeOptions = [
                'Traitement conservateur avec surveillance',
                'Chirurgie en urgence',
                'Antibiothérapie large spectre'
            ];
            fakeOptions.forEach(opt => {
                if (options.length < 4 && !options.includes(opt)) {
                    options.push(opt);
                }
            });
            return options.sort(() => Math.random() - 0.5);
        }

        // Afficher une question
        function showQuestion() {
            if (currentQuestionIndex >= quizQuestions.length) {
                showQuizResults();
                return;
            }

            const question = quizQuestions[currentQuestionIndex];
            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = `
                <div class="quiz-card">
                    <div class="quiz-question">
                        Question ${currentQuestionIndex + 1}/${quizQuestions.length}<br><br>
                        ${question.question}
                    </div>
                    <div class="quiz-options">
                        ${question.options.map((opt, i) => `
                            <div class="quiz-option" onclick="checkAnswer(${i}, '${encodeURIComponent(question.correct)}')">
                                ${opt}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Vérifier la réponse
        function checkAnswer(index, correctEncoded) {
            const correct = decodeURIComponent(correctEncoded);
            const options = document.querySelectorAll('.quiz-option');
            const selected = options[index];
            
            if (selected.textContent.trim() === correct) {
                selected.classList.add('correct');
            } else {
                selected.classList.add('incorrect');
                options.forEach(opt => {
                    if (opt.textContent.trim() === correct) {
                        opt.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentQuestionIndex++;
                showQuestion();
            }, 2000);
        }

        // Afficher les résultats du quiz
        function showQuizResults() {
            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = `
                <div class="quiz-card">
                    <h2>🎉 Quiz terminé !</h2>
                    <p>Tu as complété toutes les questions.</p>
                    <button class="mode-btn" onclick="startQuiz()">Recommencer le Quiz</button>
                    <button class="mode-btn" onclick="showStudyMode()">Retour au Mode Étude</button>
                </div>
            `;
        }

        // Mise à jour des statistiques
        function updateStats() {
            let totalPathologies = 0;
            chirurgieData.sections.forEach(section => {
                totalPathologies += section.data.length;
            });

            const studied = studiedCards.size;
            const percentage = Math.round((studied / totalPathologies) * 100);

            document.getElementById('totalPathologies').textContent = totalPathologies;
            document.getElementById('studiedCount').textContent = studied;
            document.getElementById('progressPercent').textContent = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        // Scroll vers le haut
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
